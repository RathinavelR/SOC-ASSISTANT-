<!-- 
  Sample Wazuh Manager Configuration Snippet (ossec.conf)
  Add this block inside <ossec_config> to enable automatic forwarding of alerts
  to the AI Cybersecurity SOC Assistant Backend.
-->

<ossec_config>
  <!-- Custom Integration Block -->
  <integration>
    <name>custom-soc-assistant.py</name>
    <hook_url>http://YOUR_BACKEND_HOST:5000/api/integrations/wazuh/alert</hook_url>
    <api_key>your-wazuh-integration-secret</api_key>
    <level>5</level>
    <alert_format>json</alert_format>
  </integration>

  <!-- Wazuh API Server Config (/var/ossec/api/configuration/api.yaml) -->
  <!--
    host: 0.0.0.0
    port: 55000
    use_ssl: yes
    ssl_ciphers: "DEFAULT:!RC4:!3DES:!AES128-CBC:!CAMELLIA128-CBC:!ECDHE-RSA-AES128-SHA"
  -->
</ossec_config>
